image: "git.mesalab.cn:7443/mesa_platform/build-env:master"
variables:
  GIT_STRATEGY: "clone"
  BUILD_PADDING_PREFIX: /tmp/padding_for_CPACK_RPM_BUILD_SOURCE_DIRS_PREFIX_PREFIX_PREFIX_PREFIX_PREFIX_PREFIX/

stages:
- analysis
- build
- test


.build_by_travis:
  before_script:
  - yum makecache
  - yum install -y openssl-devel rdma-core-devel
  - mkdir build || true
  tags:
  - share

run_cppcheck:
  stage: analysis
  extends: .build_by_travis
  script:
    - cd build
    - cmake3 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON ..
    - cppcheck --project=compile_commands.json --enable=all --error-exitcode=1 --suppress=unusedFunction --suppress=missingInclude --suppress=uselessAssignmentPtrArg --suppress=unreachableCode --suppress=unreadVariable --suppress=variableScope --suppress=ConfigurationNotChecked --std=c99 --force 
  tags:
    - share

run_test:
  stage: test
  extends: .build_by_travis
  script:
    - cd build/
    - cmake3 -DCMAKE_BUILD_TYPE=Debug ..
    - make -j 6
    - cd test
    - ./swarmkv_gtest


branch_build_debug:
  stage: build
  extends: .build_by_travis
  script:
    - cd build/
    - cmake3 -DCMAKE_BUILD_TYPE=Debug ..
    - make -j 6

