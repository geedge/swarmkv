    BUILD_TYPE: Debug
    SYMBOL_TARGET: libswarmkv
    PULP3_REPO_NAME: framework-stable-aarch64.el9
    PULP3_DIST_NAME: framework-stable-aarch64.el9
  extends: .build_by_travis_for_aarch64_rocky9
  artifacts:
    name: "libswarmkv-$CI_COMMIT_REF_NAME-debug"
    paths:
      - build/*.rpm
